<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Películas | Catálogo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ======================= HEADER ======================= -->
  <header class="app-header glass">
    <h1>🎬 CATÁLOGO</h1>

    <div class="session-info">
      <span id="role-badge" class="role-badge"></span>
      <button class="btn btn-secondary btn-icon" onclick="logout()">
        Cerrar sesión
      </button>
    </div>
  </header>

  <!-- ======================= CONTENIDO ======================= -->
  <main class="app-main">
    <section id="admin-panel" class="glass movie-form hidden">
      <h2 class="section-title" style="margin: 0 0 4px;">Agregar película</h2>

      <div class="form-row">
        <label for="input-titulo">Título</label>
        <input type="text" id="input-titulo" placeholder="Ej: Blade Runner" />
      </div>

      <div class="form-row">
        <label for="input-genero">Género</label>
        <input type="text" id="input-genero" placeholder="Ej: Ciencia ficción" />
      </div>

      <div class="form-row">
        <label for="input-anio">Año</label>
        <input type="number" id="input-anio" placeholder="Ej: 1982" />
      </div>

      <div class="form-row">
        <label for="input-poster">URL del póster (opcional)</label>
        <input type="url" id="input-poster" placeholder="https://ejemplo.com/poster.jpg">
        
        <img id="poster-preview" class="poster-preview hidden" alt="Vista previa del póster" />
      </div>

      <div class="form-actions">
        <button id="btn-cancel-edit" class="btn btn-secondary hidden">
          Cancelar
        </button>
        <button id="btn-submit-movie" class="btn btn-primary">
          Agregar
        </button>
      </div>
    </section>

    <h2 class="section-title">Películas</h2>

    <section class="glass filters-bar">
      <input
        type="text"
        id="search-input"
        placeholder="Buscar por título..."
        class="search-input"
      />

      <select id="filter-genero">
        <option value="">Todos los géneros</option>
      </select>

      <select id="filter-anio">
        <option value="">Todos los años</option>
      </select>
    </section>

    <div id="movies-grid" class="movies-grid"></div>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
